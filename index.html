<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNGRNG</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-blue-400">
    <div>
        <h1 class="py-10 text-center text-4xl bg-blue-200">RNG Random Name Generator</h1>
    </div>
    <div class="lg:grid grid-cols-3 px-10 py-5 gap-y-3 bg-blue-300 rounded-b-2xl">
        
        <div class="grid grid-cols-3">

            <div class="col-span-2">
                <input id="nameInput" type="text" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="Add a Name" required />
            </div>
            <div class="text-center">
                <button id="btnAddName" class="relative inline-flex items-center justify-center p-0.5 mb-2 me-2 text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white">
                    
                <span class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white rounded-md group-hover:bg-transparent group-hover:dark:bg-transparent">
                    Add Name
                </span>
            </div>
        </div>

        <div class="grid grid-cols-3">

            <div id="randomNameGen" class="bg-purple-200 rounded-lg col-span-2 text-center text-3xl font-medium mb-2">

            </div>
            <div class="text-center">
                <button id="btnRandomName" class="relative inline-flex items-center justify-center p-0.5 me-2 text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white">
                    
                <span class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white rounded-md group-hover:bg-transparent group-hover:dark:bg-transparent">
                    RANDOM Name
                </span>
            </div>
        </div>

        <div class="grid grid-cols-3">
            <div class="relative col-span-2">              
                <label id="groupSizeText" for="groupSizeRange" class="block text-sm font-medium text-gray-900">Group Size: 4</label>
                <input id="groupSizeRange" type="range"  min="2" max="20" value="4" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>  
            <div class="text-center">
                <button id="btnFormGroups" class="relative inline-flex items-center justify-center p-0.5 mb-2 me-2 text-sm font-medium text-gray-900 rounded-lg group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white">
                
                <span class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white rounded-md group-hover:bg-transparent group-hover:dark:bg-transparent">
                Form Groups
                </span>
            </div>
        </div>
    </div>
        
    <div class="text-center grid grid-cols-4 gap-y-3 px-5 lg:px-40 mt-3 h-[42rem] overflow-y-scroll" id="namesList"></div>
        
    









    

    


    
    <!-- Main modal -->
    <div id="groupModal" tabindex="-1" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full">
        <div class="relative p-4 w-full max-w-2xl max-h-full justify-self-center">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow-sm dark:bg-gray-700">
                <!-- Modal header -->
                <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600 border-gray-200">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                        Group Assignment
                    </h3>
                </div>
                <!-- Modal body -->
                <div id="groupList" class="p-4 md:p-5 space-y-4 text-white">
                    
                </div>
                <!-- Modal footer -->
                <div class="flex items-center p-4 md:p-5 border-t border-gray-200 rounded-b dark:border-gray-600">
                    <button id="btnExitModal" data-modal-hide="default-modal" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">OK</button>
                </div>
            </div>
        </div>
    </div>
  
  


























    <script type="module" src="./scripts/app.js"></script>
</body>
</html>
